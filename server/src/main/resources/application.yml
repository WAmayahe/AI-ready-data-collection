server:
  address: 0.0.0.0
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/multicam;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  bootstrap:
    controller-email: ${APP_BOOTSTRAP_CONTROLLER_EMAIL:controller@local.test}
    controller-password: ${APP_BOOTSTRAP_CONTROLLER_PASSWORD}
    remote-email: ${APP_BOOTSTRAP_REMOTE_EMAIL:remote@local.test}
    remote-password: ${APP_BOOTSTRAP_REMOTE_PASSWORD}
